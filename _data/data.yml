career-profile:
    title: About Me
    summary: |
      Python·Node.js API와 React·TypeScript UI를 함께 만드는 13년차 소프트웨어 엔지니어입니다. 제작 현장의 반복 업무를 이해하고, 실제 사용자가 매일 쓰는 도구와 자동화 시스템으로 바꿔 왔습니다.

      최근에는 Claude Code와 Codex를 개발 파트너로 활용해 요구사항 정리부터 설계, 구현, 테스트까지 이어지는 AI Native 개발 흐름을 만들고 있습니다. RAG 검색 품질 개선, 사내 AI 어시스턴트, n8n 기반 리서치 자동화, H200 GPU 기반 로컬 LLM 운영을 경험했습니다.

      현업 담당자와 문제를 정의하고, 운영 피드백과 측정 가능한 결과를 제품에 반영하는 데 강점이 있습니다.

experiences:
    - role: AI 자동화 및 플랫폼 개발
      time: 2025.01 - 2026.08
      company: 슈퍼트리 스튜디오 · AI 플랫폼 / 자동화
      details: |
        제작 현장의 자료 검색과 반복 작업을 줄이는 내부 AI 도구와 자동화 워크플로를 기획·개발·운영했습니다.

        - **사내 AI 어시스턴트와 시나리오 트레일러 플랫폼** — Next.js·React·TypeScript UI와 Python·Flask API를 연결하고, 작업 상태·대화 이력·SSE 스트리밍을 구현했습니다. ShotGrid API의 프로젝트·태스크 맥락을 검색 응답과 영상 제작 흐름에 연결했습니다.
        - **RAG 검색 품질 개선** — PDF, Excel, Word, PowerPoint 파싱·청킹·임베딩을 구성하고 Milvus 검색과 Cross Encoder 재정렬을 적용했습니다. 문서/프로젝트/태스크 검색을 묶어 출처를 포함한 답변을 제공하고, 단계별 테스트와 평가 데이터를 정비했습니다.
        - **비동기 미디어 생성** — Celery·Redis로 장시간 작업을 분리하고 ComfyUI 이미지 생성과 FFmpeg 후처리를 연결했습니다. 작업 상태 추적, 결과 전달, 실패 처리 흐름을 마련했습니다.
        - **로컬 LLM 운영** — H200 GPU에서 vLLM 기반 추론을 운영하고 LM Studio 대안을 비교했습니다. OpenAI 호환 API와 스트리밍 응답을 적용하고, 요청·토큰·컨텍스트 사용량을 분석해 프롬프트와 호출 방식을 개선했습니다.
        - **문서 파싱 최적화** — GPU 가속 PDF 이미지 추출에서 61쪽 문서를 72초에서 18초로 단축했습니다.
        - **AI Native 개발 흐름** — Claude Code·Codex와 작업 컨텍스트, 단계별 계획, 검토·테스트 기준을 정리해 설계부터 검증까지 반복 가능한 개발 루틴을 운영했습니다.
    - role: 소프트웨어 개발 및 제작 도구 자동화
      time: 2023.02 - 2026.08
      company: 슈퍼트리 스튜디오 · 제작 기술 / 자동화
      details: |
        VFX·게임 제작팀의 반복 작업을 자동화하고, 내부 도구를 안정적으로 배포·운영했습니다.

        - Python과 ShotGrid API로 태스크 할당, 이벤트 감지, 작업 큐와 상태 알림을 자동화해 PM의 반복 확인 업무를 약 50% 줄였습니다.
        - Maya·Nuke용 도구를 Python·PySide로 개발하고, 모델링·리깅·애니메이션·FX 등 5개 제작 파트의 파일 수집과 제출 검증을 표준화했습니다.
        - TransNetV2 장면 분석과 EDL·OTIO·FCP7 XML 출력을 제공하는 미디어 분석 도구를 개발했습니다.
        - GitHub Actions 기반 Windows 빌드·테스트·배포를 구성해 내부 도구의 릴리스 과정을 자동화했습니다.
        - AI 코딩 도구를 활용하는 팀 개발 규칙과 검증 루틴을 문서화하고, 작업 맥락·안전한 변경·회귀 테스트를 일관되게 적용했습니다.
    - role: 웹 애플리케이션 개발
      time: 2022.06 - 2023.01
