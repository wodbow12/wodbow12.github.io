<head>
  <title>{{ site.title }}</title>
  <meta charset="utf-8">
  <meta name="theme-color" content="{{ site.chrome_mobile_color }}">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="{{ site.description | strip_html | strip_newlines | truncate: 160 }}">
  <link rel="shortcut icon" href="favicon.ico">
  <link rel="stylesheet" href="{{ site.baseurl }}/assets/plugins/bootstrap/css/bootstrap.min.css">
  <link rel="stylesheet" href="{{ site.baseurl }}/assets/plugins/font-awesome/css/all.css">
  <link id="theme-style" rel="stylesheet" href="{{ site.baseurl }}/assets/css/main.css">
  <link rel="stylesheet" href="{{ site.baseurl }}/assets/css/flexslider.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root { --resume-ink: #172a46; --resume-accent: #2b6cb0; --resume-muted: #607089; }
    body { font-family: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; color: #26344a; line-height: 1.75; }
    .sidebar-wrapper { background: var(--resume-ink); }
    .sidebar-wrapper a { color: #d5e5fa; }
    .sidebar-wrapper .name { font-size: 27px; font-weight: 700; letter-spacing: -.04em; }
    .sidebar-wrapper .tagline { color: #d5e5fa; }
    .main-wrapper { max-width: 900px; }
    .main-wrapper .section { margin-bottom: 38px; }
    .section-title { color: var(--resume-ink); font-size: 22px; font-weight: 700; border-bottom: 1px solid #dce3ec; padding-bottom: 10px; }
    .section-title .fa-stack { color: var(--resume-accent); }
    .summary { color: #35445a; font-size: 15px; }
    .experiences-section .item { padding-bottom: 20px; border-bottom: 1px solid #edf0f4; }
    .job-title { color: var(--resume-ink); font-weight: 700; }
    .time, .company { color: var(--resume-muted); }
    .details { color: #35445a; }
    .details ul { padding-left: 20px; }
    .details li { margin-bottom: 6px; }
    .project-title a, .details a { color: var(--resume-accent); font-weight: 600; }
    .projects-section .item { margin: 0 0 13px; line-height: 1.7; }
    .project-tagline { color: #52627a; }
    .skills-section .level-title { font-size: 13px; font-weight: 600; }
    .skills-section .level-bar { height: 7px; background: #e8edf3; border-radius: 8px; }
    .skills-section .level-bar-inner { background: var(--resume-accent); border-radius: 8px; }
    @media (max-width: 767px) { .main-wrapper { padding: 30px 22px; } .section-title { font-size: 20px; } }
  </style>
</head>
